[project]
name = "url-shortener-service"
version = "0.1.0"
description = "A FastAPI microservice for shortening URLs, with PostgreSQL storage and Docker Compose deployment."
authors = [
    {name = "aklileseyoum",email = "aklileseyoum294@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "sqlalchemy (>=2.1.8,<3.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pwdlib[argon2] (>=0.4.2,<0.5.0)",
    "pyjwt (>=2.15.1,<3.0.0)",
    "slowapi (>=0.1.10,<0.2.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "greenlet (>=3.5.6,<4.0.0)",
]

[tool.poetry]
packages = [{include = "url_shortener_service", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.7.0,<5.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-psycopg2 (>=2.9.21.20261030,<3.0.0.0)",
    "pytest-asyncio (>=1.5.0,<2.0.0)",
    "snakeviz (>=2.2.2,<3.0.0)"
]

[tool.fastapi]
entrypoint = "src.url_shortener_service.main:app"

[tool.mypy]
explicit_package_bases = true

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
