[project]
name = "url-shortener-service"
version = "0.1.0"
description = "A FastAPI microservice for shortening URLs, with PostgreSQL storage and Docker Compose deployment."
authors = [
    {name = "aklileseyoum",email = "aklileseyoum294@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard] (>=0.162.0,<0.163.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
]

[tool.poetry]
packages = [{include = "url_shortener_service", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pre-commit (>=4.7.0,<5.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "ruff (>=0.17.3,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "types-psycopg2 (>=2.9.21.20261030,<3.0.0.0)"
]

[tool.fastapi]
entrypoint = "src.url_shortener_service.main:app"
