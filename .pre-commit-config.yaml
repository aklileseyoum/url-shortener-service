repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: poetry run black
        language: unsupported
        types: [python]
      - id: ruff
        name: ruff
        entry: poetry run ruff check
        language: unsupported
        types: [python]
      - id: mypy
        name: mypy
        entry: poetry run mypy src
        language: unsupported
        pass_filenames: false
        types: [python]